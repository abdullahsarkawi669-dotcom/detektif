<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan IQ & Analisis Kasus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-engine"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-basic"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }
        #tsparticles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .option-btn {
            transition: all 0.2s ease-in-out;
            position: relative;
        }
        .option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        /* ===== STATE TERPILIH — pakai !important agar TIDAK ditimpa utility Tailwind (bg-slate-800, border-slate-600, text-slate-200) yang disuntik CDN lebih belakang di source order. ===== */
        .option-btn.selected-option {
            background-color: #0284c7 !important;
            border-color: #38bdf8 !important;
            color: #ffffff !important;
            box-shadow: 0 0 0 2px #38bdf8, 0 8px 20px rgba(56, 189, 248, 0.45) !important;
            transform: translateY(-1px);
        }
        .option-btn.selected-option .option-letter {
            background-color: #ffffff !important;
            color: #0284c7 !important;
            border-color: #ffffff !important;
        }
        .option-btn.selected-option .check-mark {
            opacity: 1 !important;
            transform: scale(1) !important;
        }

        /* ===== STATE NORMAL (belum terpilih) ===== */
        .option-btn:not(.selected-option) {
            background-color: #1e293b;
            border-color: #475569;
            color: #e2e8f0;
        }

        /* Indikator visual: lingkaran huruf + centang */
        .option-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border-radius: 9999px;
            border: 2px solid #475569;
            background-color: #0f172a;
            color: #94a3b8;
            font-weight: 700;
            font-size: 0.875rem;
            flex-shrink: 0;
            transition: all 0.2s ease-in-out;
        }
        .check-mark {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 9999px;
            background-color: #ffffff;
            color: #0284c7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.875rem;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease-in-out;
        }

        /* Indikator progres jawaban */
        .progress-dot {
            width: 8px;
            height: 8px;
            border-radius: 9999px;
            background-color: #475569;
            transition: all 0.2s ease-in-out;
        }
        .progress-dot.answered {
            background-color: #38bdf8;
            box-shadow: 0 0 6px rgba(56, 189, 248, 0.6);
        }
        .progress-dot.current {
            background-color: #fbbf24;
            box-shadow: 0 0 8px rgba(251, 191, 36, 0.8);
            transform: scale(1.3);
        }

        /* Animasi kedip singkat saat memilih, supaya user yakin klik terdaftar */
        @keyframes optionPulse {
            0%   { transform: scale(1); }
            40%  { transform: scale(0.97); }
            100% { transform: scale(1); }
        }
        .option-btn.just-selected {
            animation: optionPulse 0.18s ease-out;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div id="tsparticles"></div>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="glass-panel w-full max-w-md rounded-2xl p-8 text-center">
        <h2 class="text-2xl font-bold text-sky-400 mb-4 animate-pulse">Memuat Bank Soal...</h2>
        <p class="text-slate-300 text-sm" id="loadingText">Mencari soal.js...</p>
    </div>

    <!-- Login Screen -->
    <div id="loginScreen" class="glass-panel w-full max-w-md rounded-2xl p-8 text-center hidden">
        <h1 class="text-3xl font-bold text-sky-400 mb-2">Uji Analisis IQ</h1>
        <p class="text-slate-300 mb-6 text-sm" id="totalSoalInfo"></p>
        
        <input type="text" id="usernameInput" placeholder="Masukkan Nama Anda" 
            class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-600 focus:border-sky-400 focus:ring-1 focus:ring-sky-400 outline-none transition mb-4 text-white">
        
        <button onclick="startGame()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 px-4 rounded-lg transition shadow-lg shadow-sky-500/30">
            Mulai Sesi
        </button>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="glass-panel w-full max-w-3xl rounded-2xl p-6 md:p-8 hidden relative">
        <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-4 gap-4">
            <div class="min-w-0">
                <h2 class="text-lg font-semibold text-sky-400 truncate">Pemain: <span id="playerNameDisplay" class="text-white"></span></h2>
                <p class="text-sm text-slate-400">Soal <span id="currentQuestionNum">1</span> dari 20</p>
            </div>
            <!-- Indikator progres jawaban: "X / 20 terjawab" -->
            <div class="text-right shrink-0">
                <p class="text-xs text-slate-400 mb-1">Terjawab</p>
                <p class="text-sm font-bold"><span id="answeredCounter" class="text-sky-400">0</span><span class="text-slate-500"> / 20</span></p>
            </div>
            <button onclick="stopAndScore()" class="bg-red-500 hover:bg-red-400 text-white text-sm font-bold py-2 px-4 rounded-lg transition shadow-lg shrink-0">
                Berhenti &amp; Lihat Skor
            </button>
        </div>

        <!-- Bar titik-tik progres per soal -->
        <div id="progressDots" class="flex flex-wrap gap-1.5 mb-6"></div>

        <div class="mb-8">
            <p id="questionText" class="text-lg md:text-xl leading-relaxed text-slate-100 font-medium"></p>
        </div>

        <div id="optionsContainer" class="space-y-3 mb-8">
            <!-- Options injected by JS -->
        </div>

        <div class="flex justify-between mt-6">
            <button id="prevBtn" onclick="prevQuestion()" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2 px-6 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed">
                &laquo; Sebelumnya
            </button>
            <button id="nextBtn" onclick="nextQuestion()" class="bg-sky-600 hover:bg-sky-500 text-white font-semibold py-2 px-6 rounded-lg transition">
                Selanjutnya &raquo;
            </button>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="glass-panel w-full max-w-2xl rounded-2xl p-8 text-center hidden">
        <h2 class="text-3xl font-bold text-sky-400 mb-2">Sesi Selesai!</h2>
        <p class="text-slate-300 mb-6">Berikut adalah hasil analisis Anda, <span id="resultName" class="font-bold text-white"></span>.</p>
        
        <div class="bg-slate-800/50 rounded-xl p-6 border border-slate-700 mb-8 inline-block w-full max-w-sm">
            <div class="text-6xl font-black text-white mb-2" id="finalScore">0</div>
            <p class="text-slate-400 text-sm mb-4">Skor IQ / Ketajaman Analisis</p>
            
            <div class="flex justify-between text-sm border-t border-slate-600 pt-4">
                <span class="text-slate-300">Dikerjakan: <strong id="answeredCount" class="text-white">0</strong></span>
                <span class="text-green-400">Benar: <strong id="correctCount">0</strong></span>
                <span class="text-red-400">Salah: <strong id="wrongCount">0</strong></span>
            </div>
        </div>

        <div id="pembahasanContainer" class="text-left space-y-4 mb-8 max-h-96 overflow-y-auto pr-2 border-t border-slate-700 pt-4">
            <!-- Pembahasan injected here -->
        </div>

        <button onclick="backToMenu()" class="bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 px-8 rounded-lg transition shadow-lg shadow-sky-500/30">
            Kembali ke Menu Utama
        </button>
    </div>

    <script>
        // INISIALISASI PARTICLES
        async function loadParticles() {
            await loadBasic(tsParticles);
            await tsParticles.load("tsparticles", {
                background: { color: { value: "transparent" } },
                fpsLimit: 60,
                particles: {
                    color: { value: ["#38bdf8", "#818cf8", "#e2e8f0"] },
                    links: { enable: true, color: "#334155", distance: 150, opacity: 0.4, width: 1 },
                    move: { enable: true, speed: 1.2, outModes: { default: "bounce" } },
                    number: { density: { enable: true, area: 800 }, value: 60 },
                    opacity: { value: 0.6 },
                    shape: { type: "circle" },
                    size: { value: { min: 1, max: 3 } }
                }
            });
        }
        loadParticles();

        // LOGIKA AUTO-LOADER BANK SOAL
        window.allQuestions = [];
        let currentFileIndex = 1;

        function loadQuestionBanks() {
            let script = document.createElement('script');
            let filename = currentFileIndex === 1 ? 'soal.js' : `soal${currentFileIndex}.js`;
            
            document.getElementById('loadingText').innerText = `Mencari ${filename}...`;
            script.src = filename;

            script.onload = () => {
                if (window.tempQuestions && window.tempQuestions.length > 0) {
                    window.allQuestions = window.allQuestions.concat(window.tempQuestions);
                    window.tempQuestions = []; // Reset agar siap menerima file berikutnya
                }
                currentFileIndex++;
                loadQuestionBanks(); // Coba muat file berikutnya
            };

            script.onerror = () => {
                // Berhenti mencari ketika file tidak ditemukan
                console.log(`Pemuatan selesai. Total bank soal dimuat: ${currentFileIndex - 1}`);
                if (window.allQuestions.length === 0) {
                    document.getElementById('loadingText').innerHTML = "<span class='text-red-400'>Error: soal.js tidak ditemukan!</span>";
                } else {
                    document.getElementById('loadingScreen').classList.add('hidden');
                    document.getElementById('loginScreen').classList.remove('hidden');
                    document.getElementById('totalSoalInfo').innerText = `Total ${window.allQuestions.length} soal tersedia di dalam sistem.`;
                }
            };
            document.body.appendChild(script);
        }

        // Jalankan loader saat halaman dibuka
        window.onload = loadQuestionBanks;

        // LOGIKA GAME & OFFLINE SESSION
        let session = {
            username: "",
            questions: [], // 20 soal yang terpilih untuk sesi ini
            answers: [],   // Jawaban user (index opsi)
            currentIndex: 0
        };

        const MAX_QUESTIONS = 20;

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startGame() {
            const nameInput = document.getElementById('usernameInput').value.trim();
            if (!nameInput) {
                alert("Silakan masukkan nama Anda terlebih dahulu.");
                return;
            }

            session.username = nameInput;
            const storageKey = 'iq_session_' + nameInput.toLowerCase();
            const savedSession = localStorage.getItem(storageKey);

            if (savedSession) {
                // Lanjutkan sesi yang ada
                session = JSON.parse(savedSession);
            } else {
                // Buat sesi baru dengan 20 soal acak
                let shuffled = shuffleArray(window.allQuestions);
                session.questions = shuffled.slice(0, Math.min(MAX_QUESTIONS, shuffled.length));
                session.answers = new Array(session.questions.length).fill(null);
                session.currentIndex = 0;
                saveSession();
            }

            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('playerNameDisplay').innerText = session.username;
            
            renderQuestion();
        }

        function saveSession() {
            const storageKey = 'iq_session_' + session.username.toLowerCase();
            localStorage.setItem(storageKey, JSON.stringify(session));
        }

        // Huruf label A, B, C, D...
        function letterOf(idx) {
            return String.fromCharCode(65 + idx);
        }

        function renderQuestion() {
            const qObj = session.questions[session.currentIndex];
            document.getElementById('currentQuestionNum').innerText = (session.currentIndex + 1);
            document.getElementById('questionText').innerText = qObj.caseText;
            
            const optsContainer = document.getElementById('optionsContainer');
            optsContainer.innerHTML = "";

            qObj.options.forEach((opt, idx) => {
                const isSelected = session.answers[session.currentIndex] === idx;
                // PENTING: ketika selected, JANGAN sertakan class Tailwind bg-slate-800/border-slate-600/text-slate-200
                // karena mereka akan menimpa .selected-option (Tailwind CDN disuntik lebih belakang).
                const baseClasses = 'option-btn w-full text-left p-4 rounded-xl border transition flex items-center gap-3';
                const stateClasses = isSelected
                    ? 'selected-option'
                    : 'hover:bg-slate-700 hover:border-slate-500';

                const btn = document.createElement('button');
                btn.className = `${baseClasses} ${stateClasses}`;
                btn.setAttribute('aria-pressed', isSelected ? 'true' : 'false');

                btn.innerHTML = `
                    <span class="option-letter">${letterOf(idx)}</span>
                    <span class="flex-1 leading-relaxed">${opt}</span>
                    <span class="check-mark" aria-hidden="true">&#10003;</span>
                `;
                btn.onclick = () => selectOption(idx);
                optsContainer.appendChild(btn);
            });

            // Update indikator jumlah terjawab + progress dots
            updateAnsweredIndicator();

            // Handle Tombol Navigasi
            document.getElementById('prevBtn').disabled = (session.currentIndex === 0);
            const nextBtn = document.getElementById('nextBtn');
            if (session.currentIndex === session.questions.length - 1) {
                nextBtn.innerText = "Selesai & Nilai";
                nextBtn.classList.replace('bg-sky-600', 'bg-green-600');
                nextBtn.classList.replace('hover:bg-sky-500', 'hover:bg-green-500');
            } else {
                nextBtn.innerText = "Selanjutnya \u00BB";
                nextBtn.classList.replace('bg-green-600', 'bg-sky-600');
                nextBtn.classList.replace('hover:bg-green-500', 'hover:bg-sky-500');
            }
        }

        function updateAnsweredIndicator() {
            const total = session.questions.length;
            const answered = session.answers.filter(a => a !== null).length;
            document.getElementById('answeredCounter').innerText = answered;

            // Render progress dots
            const dotsContainer = document.getElementById('progressDots');
            dotsContainer.innerHTML = '';
            for (let i = 0; i < total; i++) {
                const dot = document.createElement('span');
                let cls = 'progress-dot';
                if (session.answers[i] !== null) cls += ' answered';
                if (i === session.currentIndex) cls += ' current';
                dot.className = cls;
                dot.title = `Soal ${i + 1}` + (session.answers[i] !== null ? ' (sudah dijawab)' : ' (belum)');
                dotsContainer.appendChild(dot);
            }
        }

        function selectOption(idx) {
            const wasNull = session.answers[session.currentIndex] === null;
            session.answers[session.currentIndex] = idx;
            saveSession();
            renderQuestion(); // Re-render untuk efek highlight

            // Beri animasi kedip singkat pada opsi yang baru dipilih supaya user yakin kliknya terdaftar
            const buttons = document.querySelectorAll('#optionsContainer .option-btn');
            if (buttons[idx]) {
                buttons[idx].classList.remove('just-selected');
                // Trigger reflow supaya animasi diulang
                void buttons[idx].offsetWidth;
                buttons[idx].classList.add('just-selected');
            }
        }

        function nextQuestion() {
            if (session.currentIndex < session.questions.length - 1) {
                session.currentIndex++;
                saveSession();
                renderQuestion();
            } else {
                stopAndScore(); // Jika di soal terakhir
            }
        }

        function prevQuestion() {
            if (session.currentIndex > 0) {
                session.currentIndex--;
                saveSession();
                renderQuestion();
            }
        }

        function stopAndScore() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');

            let answeredCount = 0;
            let correctCount = 0;
            let pembahasanHTML = `<h3 class="text-xl font-bold text-sky-400 mb-4">Pembahasan Soal yang Dikerjakan:</h3>`;

            session.answers.forEach((ans, idx) => {
                if (ans !== null) {
                    answeredCount++;
                    const qObj = session.questions[idx];
                    const isCorrect = (ans === qObj.correctIndex);
                    if (isCorrect) correctCount++;

                    pembahasanHTML += `
                        <div class="bg-slate-800 p-4 rounded-xl border ${isCorrect ? 'border-green-500/50' : 'border-red-500/50'}">
                            <p class="text-sm text-slate-400 mb-2">Soal ${idx + 1}</p>
                            <p class="text-slate-200 mb-3">${qObj.caseText}</p>
                            <div class="text-sm mb-2">
                                <span class="text-slate-400">Jawaban Anda:</span> 
                                <span class="${isCorrect ? 'text-green-400' : 'text-red-400'} font-medium">
                                    ${qObj.options[ans]}
                                </span>
                            </div>
                            <div class="text-sm mt-3 p-3 bg-slate-900 rounded border border-slate-700">
                                <strong class="text-sky-400">Pembahasan:</strong> 
                                <span class="text-slate-300">${qObj.explanation}</span>
                            </div>
                        </div>
                    `;
                }
            });

            const wrongCount = answeredCount - correctCount;
            // SKOR DIHITUNG DARI BERAPA SOAL YANG DIKERJAKAN SAJA
            const score = answeredCount === 0 ? 0 : Math.round((correctCount / answeredCount) * 100);

            document.getElementById('resultName').innerText = session.username;
            document.getElementById('finalScore').innerText = score;
            document.getElementById('answeredCount').innerText = answeredCount;
            document.getElementById('correctCount').innerText = correctCount;
            document.getElementById('wrongCount').innerText = wrongCount;
            
            if (answeredCount === 0) {
                pembahasanHTML += `<p class="text-slate-400 italic text-center">Anda belum mengerjakan satupun soal.</p>`;
            }
            document.getElementById('pembahasanContainer').innerHTML = pembahasanHTML;

            // Hapus sesi agar user bisa main dari awal dengan 20 soal baru jika kembali ke menu
            localStorage.removeItem('iq_session_' + session.username.toLowerCase());
        }

        function backToMenu() {
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('usernameInput').value = ""; // Reset nama
        }
    </script>
</body>
</html>
